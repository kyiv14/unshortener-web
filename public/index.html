<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Unmask — Раскрой тайну ссылки</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #ffffff;
            color: #1d1d1f;
        }

        .logo-text {
            font-size: 32px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }
        .logo-text span { color: #de2624; }
        .logo-icon { color: #de2624; font-size: 28px; }

        .hero-title {
            font-size: 42px;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 20px;
            text-align: center;
        }
        .hero-title span { color: #de2624; }

        .hero-sub {
            color: #86868b;
            font-size: 18px;
            text-align: center;
            max-width: 450px;
            margin: 0 auto 40px;
        }

        .main-card {
            background: #fbfbfd;
            border-radius: 40px;
            padding: 40px 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.03);
            border: 1px solid rgba(0,0,0,0.02);
        }

        .input-field {
            width: 100%;
            padding: 20px 25px;
            border-radius: 20px;
            border: 1px solid #e5e5e5;
            font-size: 16px;
            font-weight: 500;
            outline: none;
            transition: 0.3s;
            background: #ffffff;
            margin-bottom: 15px;
        }
        .input-field:focus { border-color: #1d1d1f; }

        .btn-black {
            background: #1d1d1f;
            color: #ffffff;
            width: 100%;
            padding: 20px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 18px;
            transition: 0.3s;
            margin-bottom: 15px;
        }
        .btn-black:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }

        .btn-outline {
            background: transparent;
            border: 1px solid #e5e5e5;
            color: #1d1d1f;
            width: 100%;
            padding: 15px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
        }
        .btn-outline:hover { background: #f5f5f7; }

        /* Результаты */
        .result-card {
            margin-top: 30px;
            padding: 25px;
            background: #ffffff;
            border-radius: 25px;
            border: 2px solid #de2624;
            display: none;
        }
        .redirect-dot { width: 10px; height: 10px; background: #de2624; border-radius: 50%; }
    </style>
</head>
<body class="flex flex-col min-h-screen items-center px-5 py-10">

    <div class="logo-text mb-20">
        <i class="fas fa-shield-alt logo-icon"></i>
        Link <span>Unmask</span>
    </div>

    <div class="max-w-lg w-full">
        <h1 class="hero-title">Раскрой <span>тайну</span> ссылки</h1>
        <p class="hero-sub">Безопасный просмотр сокращенных URL и QR-кодов</p>

        <div class="main-card">
            <input id="urlInput" type="text" placeholder="Вставьте ссылку (bit.ly, t.co...)" class="input-field">
            
            <button onclick="unshorten()" id="btn" class="btn-black flex items-center justify-center gap-3">
                <span id="btnText">Раскрыть сейчас</span>
                <i id="loader" class="fas fa-spinner fa-spin hidden"></i>
            </button>

            <button class="btn-outline">
                <i class="fas fa-camera"></i>
                Сканировать QR с камеры
            </button>
        </div>

        <div id="result" class="result-card">
            <h3 class="text-xs font-bold uppercase tracking-widest text-red-600 mb-2">Найдена цель:</h3>
            <p id="siteTitle" class="text-xl font-extrabold mb-1"></p>
            <a id="finalUrl" href="#" target="_blank" class="text-blue-500 break-all text-sm font-semibold underline"></a>
            
            <div class="mt-4 pt-4 border-t border-gray-100">
                <p class="text-[10px] font-bold text-gray-400 uppercase mb-3">Путь ссылки:</p>
                <div id="redirectChain" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <script>
        async function unshorten() {
            const input = document.getElementById('urlInput');
            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('loader');
            const result = document.getElementById('result');
            
            if (!input.value) return;

            btnText.innerText = "Раскрываем...";
            loader.classList.remove('hidden');
            result.style.display = 'none';

            try {
                const response = await fetch('/api/unshorten', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: input.value })
                });
                const data = await response.json();

                if (data.status === 'success') {
                    document.getElementById('siteTitle').innerText = data.metadata.title;
                    document.getElementById('finalUrl').innerText = data.final_url;
                    document.getElementById('finalUrl').href = data.final_url;
                    
                    const chainBox = document.getElementById('redirectChain');
                    chainBox.innerHTML = '';
                    data.chain.forEach((link, i) => {
                        chainBox.innerHTML += `
                            <div class="flex items-center gap-3 text-[11px] font-bold text-gray-500">
                                <div class="redirect-dot"></div>
                                <span class="truncate">${link}</span>
                            </div>
                        `;
                    });

                    result.style.display = 'block';
                } else {
                    alert("Ошибка: " + data.message);
                }
            } catch (e) {
                alert("Ошибка сервера");
            } finally {
                btnText.innerText = "Раскрыть сейчас";
                loader.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
