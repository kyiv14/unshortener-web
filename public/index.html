<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="metaTitle">Link Unmask — Раскрой тайну ссылки</title>
    
    <meta name="description" id="metaDesc" content="Раскройте конечный адрес сокращенных ссылок. Безопасная проверка URL без переходов.">
    <meta name="keywords" id="metaKeys" content="раскрыть ссылку, дешифратор url, проверка ссылок, bitly unshortener">
    
    <link rel="icon" type="image/png" href="link.png">
    <link rel="apple-touch-icon" href="link.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #ffffff;
            color: #1d1d1f;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            /* Увеличен отступ сверху для всего контента */
            padding-top: 80px;
        }

        /* Кнопка выбора языка в правом верхнем углу */
        .lang-trigger {
            position: fixed;
            top: 25px;
            right: 25px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.08);
            background: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            z-index: 1000;
            font-size: 1.2rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #ffffff;
            padding: 30px;
            border-radius: 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .modal-title { font-weight: 800; margin-bottom: 25px; font-size: 1.5rem; }
        
        .lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .lang-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            border-radius: 15px;
            background: #f4f4f7;
            color: #1d1d1f;
            font-weight: 700;
            border: 2px solid transparent;
            cursor: pointer;
        }
        .lang-option.active { border-color: #de2624; background: #de2624; color: #ffffff; }

        .logo-text {
            font-size: 38px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
            letter-spacing: -1.5px;
        }
        .logo-text span { color: #de2624; }

        .hero-title {
            font-size: 40.8px;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: -1px;
        }
        .hero-title span { color: #de2624; }

        .hero-sub {
            color: #86868b;
            font-size: 19px;
            text-align: center;
            max-width: 500px;
            margin: 0 auto 25px;
            font-weight: 500;
        }

        .main-card {
            background: #fbfbfd;
            border-radius: 45px;
            padding: 40px 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.02);
            width: 100%;
        }

        .input-field {
            width: 100%;
            padding: 22px 28px;
            border-radius: 22px;
            border: 1px solid #e5e5e5;
            font-size: 17px;
            font-weight: 500;
            outline: none;
            background: #ffffff;
            margin-bottom: 20px;
            text-align: center;
        }
        .input-field:focus { border-color: #de2624; }

        .btn-black {
            background: #1d1d1f;
            color: #ffffff;
            width: 100%;
            padding: 22px;
            border-radius: 60px;
            font-weight: 800;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            border: none;
        }

        .result-card {
            margin-top: 30px;
            padding: 30px;
            background: #ffffff;
            border-radius: 30px;
            border: 2px solid #de2624;
            display: none;
        }
    </style>
</head>
<body>

    <button class="lang-trigger" onclick="openLangs()" id="currentFlag">🇷🇺</button>

    <div class="modal" id="langModal" onclick="closeLangs()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-title" id="t-select-lang">Выберите язык</div>
            <div class="lang-grid">
                <div onclick="setLang('ru')" class="lang-option" id="l-ru"><span>🇷🇺</span> RU</div>
                <div onclick="setLang('uk')" class="lang-option" id="l-uk"><span>🇺🇦</span> UK</div>
                <div onclick="setLang('en')" class="lang-option" id="l-en"><span>🇺🇸</span> EN</div>
                <div onclick="setLang('es')" class="lang-option" id="l-es"><span>🇪🇸</span> ES</div>
                <div onclick="setLang('de')" class="lang-option" id="l-de"><span>🇩🇪</span> DE</div>
                <div onclick="setLang('pl')" class="lang-option" id="l-pl"><span>🇵🇱</span> PL</div>
                <div onclick="setLang('zh')" class="lang-option" id="l-zh"><span>🇨🇳</span> ZH</div>
            </div>
        </div>
    </div>

    <div class="max-w-lg w-full px-6">
        <div class="logo-text">Link <span>Unmask</span></div>

        <h1 class="hero-title" id="t-h1">Раскрой <span>тайну</span> ссылки</h1>
        <p class="hero-sub" id="t-sub">Безопасный просмотр сокращенных URL без риска для данных</p>

        <div class="main-card">
            <input id="urlInput" type="text" placeholder="..." class="input-field">
            <button onclick="unshorten()" id="btn" class="btn-black">
                <span id="btnText">Раскрыть сейчас</span>
                <i id="loader" class="fas fa-circle-notch fa-spin hidden"></i>
            </button>
        </div>

        <div id="result" class="result-card">
            <div class="flex items-center gap-3 mb-4">
                <i class="fas fa-info-circle text-red-600"></i>
                <h3 class="text-xs font-black uppercase tracking-widest text-red-600" id="t-res-head">Результат анализа:</h3>
            </div>
            
            <div id="siteTitle" class="text-2xl font-black mb-2 text-slate-900 leading-tight"></div>
            
            <div class="bg-slate-50 p-4 rounded-2xl mb-6 border border-slate-100">
                <p class="text-[10px] font-bold text-slate-400 uppercase mb-2" id="t-res-target">Конечная цель:</p>
                <a id="finalUrl" href="#" target="_blank" class="text-blue-600 break-all text-sm font-bold underline"></a>
            </div>
            
            <div class="pt-5 border-t border-slate-100">
                <p class="text-[10px] font-bold text-slate-400 uppercase mb-4 tracking-widest" id="t-res-chain">Цепочка переходов:</p>
                <div id="redirectChain" class="space-y-1"></div>
            </div>
        </div>
    </div>

    <script>
        const langs = {
            ru: { flag: '🇷🇺', select: 'Выберите язык', h1: 'Раскрой <span>тайну</span> ссылки', sub: 'Безопасный просмотр сокращенных URL без риска для данных', ph: 'Вставьте ссылку (bit.ly, t.co...)', btn: 'Раскрыть сейчас', loading: 'Раскрываем...', res: 'Результат анализа:', target: 'Конечная цель:', chain: 'Цепочка переходов:', err: 'Ошибка сервера', no_title: 'Заголовок не найден', desc: 'Раскройте конечный адрес сокращенных ссылок. Безопасная проверка URL без переходов.', keys: 'раскрыть ссылку, дешифратор url, проверка ссылок' },
            uk: { flag: '🇺🇦', select: 'Виберіть мову', h1: 'Розкрий <span>таємницю</span> посилання', sub: 'Безпечний перегляд скорочених URL без ризику для даних', ph: 'Вставте посилання (bit.ly, t.co...)', btn: 'Розкрити зараз', loading: 'Розкриваємо...', res: 'Результат аналізу:', target: 'Кінцева мета:', chain: 'Ланцюжок переходів:', err: 'Помилка сервера', no_title: 'Заголовок не знайдено', desc: 'Розкрийте адресу скорочених посилань.', keys: 'розкрити посилання, перевірка посилань' },
            en: { flag: '🇺🇸', select: 'Select language', h1: 'Reveal the <span>link</span> mystery', sub: 'Safe browsing of shortened URLs without data risk', ph: 'Paste link (bit.ly, t.co...)', btn: 'Unmask now', loading: 'Unmasking...', res: 'Analysis result:', target: 'Final destination:', chain: 'Redirect chain:', err: 'Server Error', no_title: 'Title not found', desc: 'Reveal final destination of shortened links.', keys: 'unshorten link, check url' },
            es: { flag: '🇪🇸', select: 'Seleccionar idioma', h1: 'Revela el <span>misterio</span> del link', sub: 'Navegación segura por URLs acortadas', ph: 'Pegar enlace...', btn: 'Revelar ahora', loading: 'Revelando...', res: 'Resultado:', target: 'Destino final:', chain: 'Redirección:', err: 'Error', no_title: 'Título no encontrado', desc: 'Revela el destino de los enlaces.', keys: 'desacortar link' },
            de: { flag: '🇩🇪', select: 'Sprache wählen', h1: 'Link-<span>Geheimnis</span> enthüllen', sub: 'Sicheres Browsen von URLs', ph: 'Link einfügen...', btn: 'Jetzt enthüllen', loading: 'Enthüllung...', res: 'Ergebnis:', target: 'Endziel:', chain: 'Kette:', err: 'Fehler', no_title: 'Titel nicht gefunden', desc: 'Ziel gekürzter Links enthüllen.', keys: 'link prüfen' },
            pl: { flag: '🇵🇱', select: 'Wybierz język', h1: 'Odkryj <span>tajemnicę</span> linku', sub: 'Bezpieczne przeglądanie skróconych adresów', ph: 'Wklej link...', btn: 'Wybierz teraz', loading: 'Odkrywanie...', res: 'Wynik:', target: 'Cel końcowy:', chain: 'Łańcuch:', err: 'Błąd', no_title: 'Nie znaleziono tytułu', desc: 'Odkryj cel skróconych linków.', keys: 'sprawdź link' },
            zh: { flag: '🇨🇳', select: '选择语言', h1: '揭开<span>链接</span>谜团', sub: '安全浏览缩短的 URL', ph: '粘贴链接...', btn: '立即揭开', loading: '揭开中...', res: '分析结果:', target: '最终目的地:', chain: '重定向链:', err: '服务器错误', no_title: '未找到标题', desc: '揭开缩短链接的最终目的地。', keys: '还原链接' }
        };

        let cur = localStorage.getItem('unmask_lang') || 'ru';

        function openLangs() { document.getElementById('langModal').style.display = 'flex'; }
        function closeLangs() { document.getElementById('langModal').style.display = 'none'; }

        function setLang(code) {
            cur = code;
            localStorage.setItem('unmask_lang', code);
            updateUI();
            closeLangs();
        }

        function updateUI() {
            const t = langs[cur];
            document.getElementById('currentFlag').innerText = t.flag;
            document.getElementById('t-select-lang').innerText = t.select;
            document.getElementById('t-h1').innerHTML = t.h1;
            document.getElementById('t-sub').innerText = t.sub;
            document.getElementById('urlInput').placeholder = t.ph;
            document.getElementById('btnText').innerText = t.btn;
            document.getElementById('t-res-head').innerText = t.res;
            document.getElementById('t-res-target').innerText = t.target;
            document.getElementById('t-res-chain').innerText = t.chain;
            document.title = "Link Unmask — " + t.h1.replace('<span>', '').replace('</span>', '');
            document.getElementById('metaDesc').content = t.desc;
            document.getElementById('metaKeys').content = t.keys;
            document.querySelectorAll('.lang-option').forEach(el => el.classList.remove('active'));
            document.getElementById('l-' + cur).classList.add('active');
        }

        updateUI();

        async function unshorten() {
            const input = document.getElementById('urlInput');
            const btn = document.getElementById('btn');
            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('loader');
            const resultBox = document.getElementById('result');
            const t = langs[cur];
            
            const rawUrl = input.value.trim();
            if (!rawUrl) return;

            btn.disabled = true;
            btnText.innerText = t.loading;
            loader.classList.remove('hidden');
            resultBox.style.display = 'none';

            try {
                const response = await fetch('/api/unshorten', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: rawUrl })
                });

                const data = await response.json();

                if (data.status === 'success') {
                    let displayTitle = data.metadata.title;
                    if (!displayTitle || displayTitle === "Заголовок не найден" || displayTitle === "N/A") {
                        displayTitle = t.no_title;
                    }
                    
                    document.getElementById('siteTitle').innerText = displayTitle;
                    document.getElementById('finalUrl').innerText = data.final_url;
                    document.getElementById('finalUrl').href = data.final_url;
                    
                    const chainBox = document.getElementById('redirectChain');
                    chainBox.innerHTML = '';
                    data.chain.forEach((link) => {
                        chainBox.innerHTML += `<div class="flex items-center gap-3 py-1"><div class="w-2 h-2 bg-red-600 rounded-full flex-shrink-0"></div><span class="truncate text-[12px] font-bold text-slate-500">${link}</span></div>`;
                    });

                    resultBox.style.display = 'block';
                } else {
                    alert(t.err);
                }
            } catch (e) {
                alert(t.err);
            } finally {
                btn.disabled = false;
                btnText.innerText = t.btn;
                loader.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
