<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Unmask — Раскрой тайну ссылки</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22 fill=%22%23de2624%22>🛡️</text></svg>">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #ffffff;
            color: #1d1d1f;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Центрирование по вертикали */
            align-items: center;    /* Центрирование по горизонтали */
            min-height: 100vh;
            margin: 0;
        }

        .logo-text {
            font-size: 32px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            margin-bottom: 40px; /* Отступ логотипа от контента */
        }
        .logo-text span { color: #de2624; }
        .logo-icon { color: #de2624; font-size: 32px; }

        .hero-title {
            font-size: 40.8px; /* Уменьшено на 15% */
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 15px; /* Поднято выше */
            text-align: center;
            letter-spacing: -1px;
        }
        .hero-title span { color: #de2624; }

        .hero-sub {
            color: #86868b;
            font-size: 19px;
            text-align: center;
            max-width: 500px;
            margin: 0 auto 25px; /* Поднято ближе к карточке */
            font-weight: 500;
        }

        .main-card {
            background: #fbfbfd;
            border-radius: 45px;
            padding: 40px 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.02);
            width: 100%;
        }

        .input-field {
            width: 100%;
            padding: 22px 28px;
            border-radius: 22px;
            border: 1px solid #e5e5e5;
            font-size: 17px;
            font-weight: 500;
            outline: none;
            transition: all 0.3s ease;
            background: #ffffff;
            margin-bottom: 20px;
            text-align: center;
        }
        .input-field:focus { 
            border-color: #1d1d1f;
            box-shadow: 0 0 0 4px rgba(29, 29, 31, 0.05);
        }

        .btn-black {
            background: #1d1d1f;
            color: #ffffff;
            width: 100%;
            padding: 22px;
            border-radius: 60px;
            font-weight: 800;
            font-size: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            border: none;
        }
        .btn-black:hover { 
            background: #000000;
            transform: translateY(-3px); 
            box-shadow: 0 15px 30px rgba(0,0,0,0.15); 
        }

        .result-card {
            margin-top: 30px;
            padding: 30px;
            background: #ffffff;
            border-radius: 30px;
            border: 2px solid #de2624;
            display: none;
            animation: slideUp 0.5s ease-out;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .redirect-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
        }
        .redirect-dot { 
            width: 8px; 
            height: 8px; 
            background: #de2624; 
            border-radius: 50%; 
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div class="max-w-lg w-full px-6">
        
        <div class="logo-text">
            <i class="fas fa-shield-alt logo-icon"></i>
            Link <span>Unmask</span>
        </div>

        <h1 class="hero-title">Раскрой <span>тайну</span> ссылки</h1>
        <p class="hero-sub">Безопасный просмотр сокращенных URL без риска для данных</p>

        <div class="main-card">
            <input id="urlInput" type="text" placeholder="Вставьте ссылку (bit.ly, t.co...)" class="input-field">
            
            <button onclick="unshorten()" id="btn" class="btn-black">
                <span id="btnText">Раскрыть сейчас</span>
                <i id="loader" class="fas fa-circle-notch fa-spin hidden"></i>
            </button>
        </div>

        <div id="result" class="result-card">
            <div class="flex items-center gap-3 mb-4">
                <i class="fas fa-info-circle text-red-600"></i>
                <h3 class="text-xs font-black uppercase tracking-widest text-red-600">Результат анализа:</h3>
            </div>
            
            <div id="siteTitle" class="text-2xl font-black mb-2 text-slate-900 leading-tight"></div>
            
            <div class="bg-slate-50 p-4 rounded-2xl mb-6 border border-slate-100">
                <p class="text-[10px] font-bold text-slate-400 uppercase mb-2">Конечная цель:</p>
                <a id="finalUrl" href="#" target="_blank" class="text-blue-600 break-all text-sm font-bold underline decoration-2 underline-offset-4"></a>
            </div>
            
            <div class="pt-5 border-t border-slate-100">
                <p class="text-[10px] font-bold text-slate-400 uppercase mb-4 tracking-widest">Цепочка переходов:</p>
                <div id="redirectChain" class="space-y-1"></div>
            </div>
        </div>
    </div>

    <script>
        async function unshorten() {
            const input = document.getElementById('urlInput');
            const btn = document.getElementById('btn');
            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('loader');
            const resultBox = document.getElementById('result');
            
            const rawUrl = input.value.trim();
            if (!rawUrl) return;

            btn.disabled = true;
            btnText.innerText = "Раскрываем...";
            loader.classList.remove('hidden');
            resultBox.style.display = 'none';

            try {
                // Путь API с учетом твоего нового домена
                const response = await fetch('/api/unshorten', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: rawUrl })
                });

                const data = await response.json();

                if (data.status === 'success') {
                    document.getElementById('siteTitle').innerText = data.metadata.title || "Заголовок не найден";
                    document.getElementById('finalUrl').innerText = data.final_url;
                    document.getElementById('finalUrl').href = data.final_url;
                    
                    const chainBox = document.getElementById('redirectChain');
                    chainBox.innerHTML = '';
                    data.chain.forEach((link) => {
                        const item = document.createElement('div');
                        item.className = 'redirect-item';
                        item.innerHTML = `
                            <div class="redirect-dot"></div>
                            <span class="truncate text-[12px] font-bold text-slate-500">${link}</span>
                        `;
                        chainBox.appendChild(item);
                    });

                    resultBox.style.display = 'block';
                } else {
                    alert("Ошибка: " + (data.message || "Не удалось проверить ссылку"));
                }
            } catch (e) {
                alert("Ошибка соединения с сервером");
            } finally {
                btn.disabled = false;
                btnText.innerText = "Раскрыть сейчас";
                loader.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
